[project]
name = "sunofriend"
dynamic = ["version"]
description = "Listen deeper: turn separated music stems into editable MIDI and a song-interpretation WAV."
readme = "PYPI.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9,<3.12"
authors = [
    { name = "Errol Elliott" },
]
keywords = [
    "audio-to-midi",
    "garageband",
    "midi",
    "music-production",
    "stem-transcription",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "textual>=8.2,<9",
]

[project.urls]
Homepage = "https://github.com/N9-Developer-Empowerment/sunofriend"
Documentation = "https://github.com/N9-Developer-Empowerment/sunofriend#readme"
Issues = "https://github.com/N9-Developer-Empowerment/sunofriend/issues"
Source = "https://github.com/N9-Developer-Empowerment/sunofriend"

[project.optional-dependencies]
# Audio analysis and transcription. FluidSynth remains a system dependency.
convert = [
    "numpy>=2.0,<2.1",
    "librosa>=0.10,<0.12",
    "soundfile>=0.12,<0.14",
    "basic-pitch>=0.3,<0.5",
    # Basic Pitch prefers the ONNX model in Sunofriend; this keeps inference
    # available on Apple Silicon without installing TensorFlow.
    "onnxruntime>=1.17,<2",
    # coremltools 9 disables its conversion API with newer scikit-learn.
    "scikit-learn>=1.0,<=1.5.1",
    # basic-pitch's resampy constraint still imports pkg_resources.
    "setuptools>=69,<81",
]
playback = [
    "mido>=1.3,<2",
    "python-rtmidi>=1.5,<2",
]
all = [
    "numpy>=2.0,<2.1",
    "librosa>=0.10,<0.12",
    "soundfile>=0.12,<0.14",
    "basic-pitch>=0.3,<0.5",
    "onnxruntime>=1.17,<2",
    "scikit-learn>=1.0,<=1.5.1",
    "setuptools>=69,<81",
    "mido>=1.3,<2",
    "python-rtmidi>=1.5,<2",
]
# Compatibility aliases retained for existing install commands.
listen = [
    "numpy>=2.0,<2.1",
    "librosa>=0.10,<0.12",
    "soundfile>=0.12,<0.14",
    "basic-pitch>=0.3,<0.5",
    "onnxruntime>=1.17,<2",
    "scikit-learn>=1.0,<=1.5.1",
    "setuptools>=69,<81",
]
midi = [
    "mido>=1.3,<2",
    "python-rtmidi>=1.5,<2",
]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
    "ruff>=0.15,<0.16",
    # Tests build the wheel without isolation to inspect packaged resources.
    "setuptools>=77,<81",
    "twine>=6,<7",
]
quality = [
    # Measurement-only tooling, run in a separate Python 3.11 environment.
    "coverage==7.15.3",
    "radon==6.0.1",
]
mutation = [
    # Mutation-only tooling, run in the same isolated quality environment.
    "mutmut==3.7.0",
]

[project.scripts]
sunofriend = "sunofriend.cli:main"
sunofriend-separate = "sunofriend.separation_alpha:main"

[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "sunofriend.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sunofriend = [
    "_separation_native_spawn_darwin.c",
    "workbench.html",
    "workbench_clips.js",
    "workbench_developer.js",
    "workbench_instrument_review.js",
    "workbench_master_review.js",
    "workbench_transport.js",
    "workbench_visualization.js",
    "vocal_session.html",
    "vocal_session.css",
    "vocal_session.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "trusted_local: live security probe that requires a locally owned macOS toolchain and Python runtime",
]

[tool.coverage.run]
branch = true
data_file = "work/quality/.coverage"
relative_files = true
source = ["src/sunofriend"]

[tool.coverage.json]
output = "work/quality/coverage.json"
pretty_print = true
show_contexts = false

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mutmut]
source_paths = ["src"]
only_mutate = [
    "src/sunofriend/source_roles.py",
    "src/sunofriend/automatic_selection.py",
    "src/sunofriend/separation_review_transport.py",
]
pytest_add_cli_args_test_selection = [
    "-m",
    "not trusted_local",
    "tests/test_source_roles.py",
    "tests/test_automatic_selection.py",
    "tests/test_separation_review_transport.py",
]
mutate_only_covered_lines = false
use_setproctitle = false
use_git_change_detection = false
