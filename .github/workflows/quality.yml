name: Manual Full Quality

on:
  workflow_dispatch:
    inputs:
      run_mutation:
        description: Run the complete three-module mutation pilot
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: manual-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  complete-quality:
    name: Complete macOS quality baseline
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the isolated quality stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[all,dev,quality]'
      - name: Capture the pre-run source binding
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/quality/complete
          python -m devtools.architecture_viewer --plan \
            > work/quality/complete/architecture-plan.json
          source_hash="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source_tree_sha256"])' work/quality/complete/architecture-plan.json)"
          echo "hash=$source_hash" >> "$GITHUB_OUTPUT"
      - name: Run complete branch-aware coverage
        env:
          COVERAGE_FILE: work/quality/complete/.coverage
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src \
            python -m coverage run -m pytest -q -m 'not trusted_local'
          python -m coverage json -o work/quality/complete/coverage.json
      - name: Build the complete source-bound CRAP report
        env:
          SOURCE_HASH: ${{ steps.source.outputs.hash }}
        run: |
          python scripts/report-code-risk.py \
            --coverage-json work/quality/complete/coverage.json \
            --out work/quality/complete/code-risk.json \
            --coverage-binding-out work/quality/complete/coverage-binding.json \
            --source-tree-sha256-before "$SOURCE_HASH"
          python -m devtools.architecture_viewer --check \
            > work/quality/complete/architecture-check.json
      - name: Retain path-free complete quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-code-quality-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            work/quality/complete/architecture-plan.json
            work/quality/complete/architecture-check.json
            work/quality/complete/coverage.json
            work/quality/complete/coverage-binding.json
            work/quality/complete/code-risk.json

  complete-mutation:
    name: Complete three-module mutation pilot
    if: ${{ inputs.run_mutation }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the bounded mutation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[all,dev,quality,mutation]'
      - name: Capture the pre-run source binding
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/quality/complete-mutation
          python -m devtools.architecture_viewer --plan \
            > work/quality/complete-mutation/architecture-plan.json
          source_hash="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source_tree_sha256"])' work/quality/complete-mutation/architecture-plan.json)"
          echo "hash=$source_hash" >> "$GITHUB_OUTPUT"
      - name: Run the complete bounded pilot
        run: |
          python -m mutmut run --max-children 4 'sunofriend.source_roles*'
          python -m mutmut run --max-children 4 'sunofriend.automatic_selection*'
          python -m mutmut run --max-children 4 \
            'sunofriend.separation_review_transport*'
      - name: Build the complete mutation report
        env:
          SOURCE_HASH: ${{ steps.source.outputs.hash }}
        run: |
          python scripts/report-mutation.py \
            --mutants-root mutants \
            --classifications docs/mutation-pilot-classifications.json \
            --out work/quality/complete-mutation/mutation.json \
            --source-tree-sha256-before "$SOURCE_HASH"
      - name: Retain path-free complete mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-mutation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            work/quality/complete-mutation/architecture-plan.json
            work/quality/complete-mutation/mutation.json
