name: Fast CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Fast merge checks (Linux, Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the portable development stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests devtools scripts
      - name: Enforce architecture contracts
        run: python -m devtools.architecture_viewer --check
      - name: Run the bounded invariant suite
        run: |
          python -m pytest -q \
            tests/test_product_contract.py \
            tests/test_source_roles.py \
            tests/test_automatic_selection.py \
            tests/test_architecture_viewer.py \
            tests/test_architecture_viewer_cli.py \
            tests/test_architecture_viewer_governance.py \
            tests/test_architecture_viewer_browser_logic.py \
            tests/test_architecture_viewer_overlays.py \
            tests/test_code_risk_report.py \
            tests/test_code_risk_ratchet.py \
            tests/test_mutation_report.py \
            tests/test_skill_bootstrap.py \
            tests/test_separation_review_transport.py
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m venv "${RUNNER_TEMP}/sunofriend-wheel"
          "${RUNNER_TEMP}/sunofriend-wheel/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/sunofriend-wheel/bin/sunofriend" --version
          "${RUNNER_TEMP}/sunofriend-wheel/bin/python" -m sunofriend --help
