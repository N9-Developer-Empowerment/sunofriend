name: DAW / AI compatibility report
description: Report a Sunofriend test with another DAW, music tool, AI generator, separator or MIDI device.
title: "[Compatibility]: "
body:
  - type: dropdown
    id: scope
    attributes:
      label: Test scope
      options:
        - Experimental local stem separation
        - DAW MIDI import or playback
        - Software instrument or notation tool
        - Hardware MIDI instrument or sequencer
        - AI music generator input
        - Stem separator or chord-analysis input
        - Operating-system compatibility
        - Other music software
    validations:
      required: true
  - type: input
    id: software
    attributes:
      label: Software or hardware and version
      placeholder: "Example: REAPER 7.30, Ableton Live 12, FL Studio 2025, or hardware model/firmware"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
      placeholder: "Example: Windows 11 x64, Ubuntu 24.04, macOS 15 Apple Silicon"
    validations:
      required: true
  - type: input
    id: sunofriend
    attributes:
      label: Sunofriend version or commit
      placeholder: "Example: 0.3.0 or git commit SHA"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source workflow
      description: Name the authorised AI generator, separator/chord tool, source key/BPM and stem types. Do not attach material you cannot redistribute.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Sunofriend command
      description: Include the exact command and conversion mode, or enter `N/A — bundled example pack` when you imported the committed MIDI directly.
      render: shell
  - type: input
    id: separation_profile
    attributes:
      label: Separation scope and profile
      description: Optional for non-separation reports. For separation, paste the scope and immutable profile ID from Copy text-only feedback.
      placeholder: "core-four-stems-v1 / scnet-large-musdb-release-v1"
  - type: textarea
    id: settings
    attributes:
      label: DAW or device settings
      description: Include project tempo, import options, quantisation, tempo-follow/stretching, channel mapping and relevant UI settings.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: Include missing/extra notes, pitch or octave errors, track/channel mapping, first-note offset and end drift where relevant.
    validations:
      required: true
  - type: dropdown
    id: usefulness
    attributes:
      label: Musical usefulness
      description: For stem separation, judge whether the result helps the next musical task after ordinary listening. Choose Not tested for other reports.
      options:
        - Not tested
        - Useful
        - Useful with limitations
        - Not useful yet
        - Cannot tell
    validations:
      required: true
  - type: checkboxes
    id: separation_observations
    attributes:
      label: Stem-separation observations
      description: Optional. Select every plainly audible issue. A quiet imperfection that does not affect musical use does not need to be promoted to a failure.
      options:
        - label: Important vocal content is missing or placed in the instrumental stem.
        - label: Important instrumental content is missing or placed in the vocal stem.
        - label: Important drum or percussion content is missing, softened or placed in another stem.
        - label: Important bass content is missing or placed in another stem.
        - label: Grouped other has important holes or misleading reconstruction correction.
        - label: Bleed or artefacts make a stem hard to use.
        - label: Timing, joins, clicks or sudden tone or level changes are audible.
        - label: Reconstruction differs materially from the source.
        - label: Processing failed, stalled or used excessive time or memory.
  - type: dropdown
    id: downstream_midi
    attributes:
      label: Downstream MIDI outcome
      description: Choose Not tested unless you explicitly made a separate MIDI/Create run from the reviewed stems.
      options:
        - Not tested
        - Improved
        - No change
        - Worse
        - Cannot tell
    validations:
      required: true
  - type: textarea
    id: text_only_separation_feedback
    attributes:
      label: Text-only separation feedback
      description: Optional. Paste the review page's Copy text-only feedback here. Do not attach review JSON, filenames, private metadata, stems or source audio.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and authorised attachments
      description: Add timing measurements, screenshots, small non-review MIDI/JSON files or redacted logs only when you own them or have permission to share them. Do not upload private source audio, stems, review JSON, filenames or metadata; describe what you heard instead.
  - type: checkboxes
    id: rights
    attributes:
      label: Rights and privacy
      options:
        - label: I have permission to share every attachment and have removed private or confidential information.
          required: true
