interface:
  display_name: "Sunofriend"
  short_description: "From no setup or stems to editable MIDI and WAV"
  icon_small: "./assets/sunofriend-logo.png"
  icon_large: "./assets/sunofriend-logo.png"
  brand_color: "#00E6FF"
  default_prompt: "Use $sunofriend. I may be new to music software, so offer the built-in demo, my authorised synchronized WAV stems, preparation of 2–64 already-separated supported audio parts, preparation of one standalone local audio asset, or help obtaining stems. Explain one step at a time; never describe folder preparation as stem separation or alignment repair. Inspect first. If setup is needed, ask before preparing the source, show me its exact commit, then ask separately before installing that unchanged commit. Prefer the automatic local MIDI/WAV/ZIP route first, then use the TUI and Workbench Studio only when I want multi-method comparison, explicit feedback or a reviewed GarageBand handoff."
