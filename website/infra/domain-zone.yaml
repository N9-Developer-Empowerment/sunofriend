AWSTemplateFormatVersion: "2010-09-09"
Description: Route 53 records for the Sunofriend website, Hover inbound email and Amazon SES outbound email.

Parameters:
  RootDomain:
    Type: String
    Default: sunofriend.com
  AlternateDomain:
    Type: String
    Default: www.sunofriend.com
  MailFromDomain:
    Type: String
    Default: mail.sunofriend.com
  SesDkimTokenOne:
    Type: String
    Default: lnsrenhfimkn5uezbch4tcpln6qnd2fl
  SesDkimTokenTwo:
    Type: String
    Default: czg5e543jvwpirecvsygf3pyz2ir4ycc
  SesDkimTokenThree:
    Type: String
    Default: 3ejtaxmew5cpflnfat4miek5i5rrvpgg
  CloudFrontDomainName:
    Type: String
    Description: CloudFront distribution hostname without a protocol.
  RootValidationRecordName:
    Type: String
    Description: ACM validation CNAME name for the root domain.
  RootValidationRecordValue:
    Type: String
    Description: ACM validation CNAME value for the root domain.
  AlternateValidationRecordName:
    Type: String
    Description: ACM validation CNAME name for the alternate domain.
  AlternateValidationRecordValue:
    Type: String
    Description: ACM validation CNAME value for the alternate domain.

Resources:
  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref RootDomain
      HostedZoneConfig:
        Comment: DNS for the Sunofriend launch website and preserved Hover mail.
      HostedZoneTags:
        - Key: Application
          Value: Sunofriend
        - Key: Surface
          Value: LaunchSite

  WebsiteAndMailRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZone
      RecordSets:
        - Name: !Ref RootDomain
          Type: A
          AliasTarget:
            DNSName: !Ref CloudFrontDomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Ref RootDomain
          Type: AAAA
          AliasTarget:
            DNSName: !Ref CloudFrontDomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Ref AlternateDomain
          Type: A
          AliasTarget:
            DNSName: !Ref CloudFrontDomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Ref AlternateDomain
          Type: AAAA
          AliasTarget:
            DNSName: !Ref CloudFrontDomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Ref RootDomain
          Type: MX
          TTL: "900"
          ResourceRecords:
            - "10 mx.hover.com.cust.hostedemail.com."
        - Name: !Ref RootDomain
          Type: TXT
          TTL: "300"
          ResourceRecords:
            - '"v=spf1 include:amazonses.com -all"'
        - Name: !Sub "_dmarc.${RootDomain}"
          Type: TXT
          TTL: "300"
          ResourceRecords:
            - '"v=DMARC1; p=none; adkim=r; aspf=r; pct=100"'
        - Name: !Ref MailFromDomain
          Type: MX
          TTL: "300"
          ResourceRecords:
            - "10 feedback-smtp.eu-west-2.amazonses.com."
        - Name: !Ref MailFromDomain
          Type: TXT
          TTL: "300"
          ResourceRecords:
            - '"v=spf1 include:amazonses.com -all"'
        - Name: !Sub "${SesDkimTokenOne}._domainkey.${RootDomain}"
          Type: CNAME
          TTL: "300"
          ResourceRecords:
            - !Sub "${SesDkimTokenOne}.dkim.amazonses.com."
        - Name: !Sub "${SesDkimTokenTwo}._domainkey.${RootDomain}"
          Type: CNAME
          TTL: "300"
          ResourceRecords:
            - !Sub "${SesDkimTokenTwo}.dkim.amazonses.com."
        - Name: !Sub "${SesDkimTokenThree}._domainkey.${RootDomain}"
          Type: CNAME
          TTL: "300"
          ResourceRecords:
            - !Sub "${SesDkimTokenThree}.dkim.amazonses.com."
        - Name: !Ref RootValidationRecordName
          Type: CNAME
          TTL: "300"
          ResourceRecords:
            - !Ref RootValidationRecordValue
        - Name: !Ref AlternateValidationRecordName
          Type: CNAME
          TTL: "300"
          ResourceRecords:
            - !Ref AlternateValidationRecordValue

Outputs:
  HostedZoneId:
    Description: Route 53 hosted zone ID.
    Value: !Ref HostedZone
  NameServers:
    Description: Set these four authoritative name servers at Hover.
    Value: !Join [",", !GetAtt HostedZone.NameServers]
